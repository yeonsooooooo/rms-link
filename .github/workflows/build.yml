name: RmsLink Windows validation
on:
  push:
    branches: [main, codex/rmslink-control]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Shared parser regressions
        shell: pwsh
        run: |
          dotnet run --project tests/core/Core.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Parser tests failed' }
          dotnet publish tests/core/Core.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o core
          if ($LASTEXITCODE -ne 0) { throw 'Core publish failed' }
          $env:RMSLINK_CORE = "$pwd/core/RmsLinkCore.exe"
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Control tests failed' }
      - name: Build Windows app and run runtime tests
        shell: pwsh
        run: |
          dotnet publish RmsLink.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -o publish
          if ($LASTEXITCODE -ne 0) { throw 'App build failed' }
          $report = "$pwd/runtime-test.json"
          $p = Start-Process publish/RmsLink.exe -ArgumentList @('--runtime-test', $report) -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Windows runtime test failed' }
          dotnet publish installer/Installer.csproj -c Release -r win-x64 --self-contained true -o launcher
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
          Compress-Archive -Path publish/* -DestinationPath RmsLink.zip
          $hash=(Get-FileHash RmsLink.zip -Algorithm SHA256).Hash.ToLower()
          $version=([xml](Get-Content RmsLink.csproj)).Project.PropertyGroup.Version
          @{ passed=$true; version=$version; sha256=$hash; commit=$env:GITHUB_SHA; platform='windows-x64'; physicalKeytechVerified=$false; runtime=(Get-Content $report|ConvertFrom-Json) } | ConvertTo-Json -Depth 8 | Set-Content validation.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: rmslink-windows-validated
          path: |
            RmsLink.zip
            validation.json
            runtime-test.json
            launcher/RmsLinkLauncher.exe
          retention-days: 30
