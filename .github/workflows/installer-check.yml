name: RmsLink installer verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Download and execute the exact installer
        shell: pwsh
        env:
          RMSLINK_INSTALLER_URL: ${{ secrets.RMSLINK_INSTALLER_URL }}
          RMSLINK_INSTALLER_SHA256: ${{ secrets.RMSLINK_INSTALLER_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = [Uri]$env:RMSLINK_INSTALLER_URL
          if ($uri.Scheme -ne 'https' -or $uri.Host -ne 'ys-macmini.tail984bfd.ts.net' -or $uri.Port -ne 8443) { throw 'Unexpected installer origin' }
          $ProgressPreference = 'SilentlyContinue'
          curl.exe --fail --location --retry 2 --max-time 1200 --silent --show-error --output RmsLink-Setup.exe $uri.AbsoluteUri
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          $sha = (Get-FileHash RmsLink-Setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $env:RMSLINK_INSTALLER_SHA256) { throw 'Installer digest mismatch' }
          $report = "$pwd/installer-verification.json"
          $process = Start-Process -FilePath "$pwd/RmsLink-Setup.exe" -ArgumentList @('--install-test', $report) -PassThru
          if (-not $process.WaitForExit(90000)) { Stop-Process -Id $process.Id; throw 'Installer timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Installer startup failed' }
          $result = Get-Content $report | ConvertFrom-Json
          if (-not $result.passed) { throw 'Installer verification failed' }
          $root = Join-Path $env:LOCALAPPDATA 'RmsLink'
          $version = (Get-Content (Join-Path $root 'current.txt')).Trim()
          if ($version -ne $result.version) { throw 'Installed version pointer mismatch' }
          $launcher = Join-Path $root 'RmsLinkLauncher.exe'
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut((Join-Path ([Environment]::GetFolderPath('Desktop')) 'RmsLink 연결 설정.lnk'))
          @{ target=$shortcut.TargetPath; arguments=$shortcut.Arguments; expected=$launcher; shortcutExists=(Test-Path $shortcut.FullName) } | ConvertTo-Json
          if ($shortcut.TargetPath -ne $launcher -or $shortcut.Arguments -ne '--setup') { throw 'Setup shortcut does not use current-version launcher' }
          $startup = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').RmsLink
          if ($startup -ne ('"' + $launcher + '"')) { throw 'Automatic startup does not use launcher' }
          $app = Join-Path $root "versions/$version/RmsLink.exe"
          $runtimeReport = Join-Path $pwd 'installed-runtime.json'
          $runtime = Start-Process -FilePath $app -ArgumentList @('--runtime-test', $runtimeReport) -PassThru
          if (-not $runtime.WaitForExit(45000)) { Stop-Process -Id $runtime.Id; throw 'Installed runtime timed out' }
          if ($runtime.ExitCode -ne 0 -or -not (Test-Path $runtimeReport)) { throw 'Installed runtime failed' }
          $runtimeResult = Get-Content $runtimeReport | ConvertFrom-Json
          if (-not $runtimeResult.passed -or $runtimeResult.version -ne $version -or $null -ne $runtimeResult.captureTests) { throw 'Installed update preflight failed' }
          @{ passed=$true; version=$version; launcherShortcut=$true; automaticStartup=$true; installedRuntime=$true; installerSha256=$sha; windows=[Environment]::OSVersion.VersionString; installed=$result.installed; dashboardShortcut=$result.dashboardShortcut; connectionShortcut=$result.connectionShortcut; customIcon=$result.customIcon; installerExecuted=$true; guiInstallPerformed=$false; physicalKeytechVerified=$false; checkedAt=[DateTimeOffset]::UtcNow.ToString('o') } | ConvertTo-Json | Set-Content $report -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rmslink-installer-verification
          path: installer-verification.json
          retention-days: 30
