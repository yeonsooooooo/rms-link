name: Windows shortcut path diagnosis
on:
  push:
    branches: [codex/shortcut-probe-041]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Add-Type -Path "$pwd/shared/ShortcutFile.cs"
          $folder = Join-Path $env:LOCALAPPDATA 'RmsLink'
          New-Item -ItemType Directory -Force $folder | Out-Null
          $target = Join-Path $folder 'RmsLinkLauncher.exe'
          Copy-Item "$env:WINDIR/System32/notepad.exe" $target
          $path = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'RmsLink 연결 설정.lnk'
          [RmsLink.Shared.ShortcutFile]::Create($path,$target,'test',$target,'--setup',$folder)
          $native = [RmsLink.Shared.ShortcutFile]::Read($path)
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($path)
          @{expected=$target; native=$native; scriptTarget=$shortcut.TargetPath; scriptArguments=$shortcut.Arguments; scriptFile=$shortcut.FullName; exists=(Test-Path $path); envLocal=$env:LOCALAPPDATA; nativeLocal=[Environment]::GetFolderPath('LocalApplicationData'); desktop=[Environment]::GetFolderPath('Desktop'); desktopDirectory=[Environment]::GetFolderPath('DesktopDirectory')} | ConvertTo-Json -Depth 4
          $copyPath = Join-Path $pwd 'probe-ascii.lnk'
          Copy-Item -LiteralPath $path -Destination $copyPath
          $copy = $shell.CreateShortcut($copyPath)
          if ($copy.TargetPath -ne $target -or $copy.Arguments -ne '--setup') { throw 'ASCII inspection copy mismatch' }
          Write-Output 'Identical ASCII inspection copy preserves the target and arguments.'
